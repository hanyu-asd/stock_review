name: 📈 A股每日复盘推送

on:
  schedule:
    - cron: '35 7 * * 1-5'   # 北京时间 15:35
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🐍 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 🚀 运行复盘脚本
        run: python main.py
        env:
          # 邮件配置
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_PASSWORD: ${{ secrets.EMAIL_FROM_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # AI 配置
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_SDK_TOKEN }}
          MODELSCOPE_MODEL: ${{ secrets.MODELSCOPE_MODEL }}

      - name: 📁 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: ./reports/*.html
          retention-days: 7